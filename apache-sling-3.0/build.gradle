
// Build.gradle generated for instrumentation module apache-sling

apply plugin: 'java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    
    
}

dependencies {
   // Declare a dependency on each JAR you want to instrument
   // Example:
   // implementation 'javax.servlet:servlet-api:2.5'

   // New Relic Java Agent dependencies
 
   implementation  'org.apache.sling:org.apache.sling.api:3.0.0'
   implementation  'org.apache.sling:org.apache.sling.engine:3.0.0'
   implementation  'jakarta.servlet:jakarta.servlet-api:6.0.0'
  
  
   
   
   implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
   implementation fileTree(include: ['*.jar'], dir: '../test-lib')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.apache-sling'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': 1.1
  }
}

verifyInstrumentation {
    passesOnly("org.apache.sling:org.apache.sling.engine:[3.0.0,)") {
        implementation 'org.apache.sling:org.apache.sling.api:3.0.0'
        implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    }
    
  
}

 
